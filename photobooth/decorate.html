<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裝飾照片 - ギャルPURI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="decorate">
    <div class="phone-container">
        <h1 class="gal-title">DECORATE 💖</h1>
        <div class="content-area">
            <div class="sticker-menu">
                <div class="sticker-item" data-src="images/sticker_heart.png">❤️</div>
                <div class="sticker-item" data-src="images/sticker_star.png">⭐</div>
                <div class="sticker-item" data-src="images/sticker_gal.png">ギャル</div>
            </div>
            
            <div class="photo-workspace" id="workspace">
                <img id="captured-img" src="" alt="Captured">
                <img id="frame-overlay-dec" class="frame-overlay" src="" alt="Frame">
            </div>
        </div>
        <button class="gal-btn" id="finish-btn">OK! NEXT 👉</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
